name: Compilar extensión

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar la clave de firma
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto KEYSTORE_BASE64. Sin una firma fija, Mihon no podrá actualizar la extensión."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/signing.jks" >> "$GITHUB_ENV"

      - name: Compilar APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :extension:assembleRelease --no-daemon

      - name: Generar repositorio para Mihon
        if: github.event_name != 'pull_request'
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          python3 .github/scripts/make_repo.py \
            --apk extension/build/outputs/apk/release/extension-release.apk \
            --icon icon/ic_launcher-web.png \
            --apksigner "$APKSIGNER" \
            --repo "${{ github.repository }}" \
            --out repo-out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: extension/build/outputs/apk/release/*.apk

      - name: Publicar en la rama "repo"
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: repo
          publish_dir: repo-out
          force_orphan: true
          commit_message: Actualizar repositorio de extensiones

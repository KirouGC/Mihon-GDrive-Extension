name: Compilar extensión

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar la clave de firma
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto KEYSTORE_BASE64. Sin una firma fija, Mihon no podrá actualizar la extensión."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/signing.jks" >> "$GITHUB_ENV"

      - name: Compilar APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :src:googledrive:assembleRelease :src:nyaa:assembleRelease --no-daemon

      - name: Generar repositorio para Mihon
        if: github.event_name != 'pull_request'
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          python3 .github/scripts/make_repo.py \
            --apk src/googledrive/build/outputs/apk/release/googledrive-release.apk \
            --apk src/nyaa/build/outputs/apk/release/nyaa-release.apk \
            --icons icon \
            --page .github/pages/index.html \
            --apksigner "$APKSIGNER" \
            --repo "${{ github.repository }}" \
            --out repo-out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: src/*/build/outputs/apk/release/*.apk

      - name: Publicar en la rama "repo"
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: repo
          publish_dir: repo-out
          force_orphan: true
          commit_message: Actualizar repositorio de extensiones

      - name: Preparar GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo-out

  # Publica la página "Agregar a Mihon". Requiere activar Pages con origen "GitHub Actions";
  # si no está activado, este paso falla sin afectar al repositorio de extensiones.
  pages:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
